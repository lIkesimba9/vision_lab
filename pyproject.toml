[project]
name = "vision-lab"
version = "0.1.0"
description = "Библиотека для обучения CV-моделей: классификация + self-supervised предобучение (Lightning + Hydra + timm)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "lightning>=2.4",
    "timm>=1.0",
    "kornia>=0.7.3",
    "albumentations>=1.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torchmetrics>=1.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]

[project.scripts]
vision-lab-train = "vision_lab.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_lab"]
# YAML-конфиги — часть пакета (эталонные Hydra-шаблоны)
include = ["vision_lab/**/*.yaml"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
